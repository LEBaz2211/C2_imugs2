name: Contract documentation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: Check generated contracts are current
        run: python -m c2_imugs2.contract_docs check
      - name: Build searchable contract reference
        run: mkdocs build --strict
