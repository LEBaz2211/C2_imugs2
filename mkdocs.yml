site_name: C2 iMUGS2 Contract Reference
site_description: Source-extracted HTTP, ROS, schema, enum, and state contracts for the C2 iMUGS2 system
site_url: https://lebaz2211.github.io/C2_imugs2/
dev_addr: 127.0.0.1:8001
repo_url: https://github.com/LEBaz2211/C2_imugs2
repo_name: LEBaz2211/C2_imugs2
docs_dir: docs/generated
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

watch:
  - src/c2_imugs2
  - backend
  - schemas
  - frontend/src
  - docker-compose.yml
  - docker-compose.backend.yml

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/contract-reference.css

# Navigation is generated by scripts/mkdocs_hooks.py from the extracted
# contract groups so new methods, namespaces, packages, and schemas appear
# without maintaining this file by hand.
