planner_node:
    ros__parameters:
            mapf: "independent_agents"
            map_radius: 60.0
            epsg: "epsg:4326"
            initial_position: [50.84421071013057 , 4.39196312480243]
            # The current RMA OSM component is ~21.5 m from the seeded local
            # road/geofence component. Keep a small margin so the two valid
            # map sources form one routable graph.
            poly_graph_connect_max_distance: 25.0
            line_graph_connect_max_distance: 25.0
            merge_nodes: True
            merge_nodes_max_distance: 1.0
            populate_graph: False
            populate_min_distance: 20.0
            points_in_polygon_dist: 5.0
            map_folder: "/data/map/rma"
            load_map_from_database: True
            load_map_from_local_folder: False
            mongodb_url: "mongodb://localhost:27017/"
            map_feature_collection: "rma"
            scenario_activation_token: "startup"
            # Scenario activation freezes OSM roads into MapDB. The deployed
            # planner must never download a second, different graph at runtime.
            load_osm_from_network: False
