services:
  c2-imugs2-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    network_mode: host
    environment:
      C2_IMUGS2_REPO_ROOT: /app
      C2_IMUGS2_HOST_REPO_ROOT: ${PWD}
      C2_IMUGS2_LEGACY_REST_URL: http://localhost:5001/mission_control
      C2_IMUGS2_ROSBRIDGE_URL: ws://localhost:9090
      C2_IMUGS2_MONGO_BOOTSTRAP: "true"
      C2_IMUGS2_LLM_BASE_URL: ${C2_IMUGS2_LLM_BASE_URL:-http://10.67.80.81:1234/v1}
      C2_IMUGS2_LLM_MODEL: ${C2_IMUGS2_LLM_MODEL:-qwen/qwen3.8-27b}
      C2_IMUGS2_LLM_API_KEY: ${C2_IMUGS2_LLM_API_KEY:-sk-lm-uAIMcByi:JuFWN6WvqgTKddP241dl}
      C2_IMUGS2_LLM_PROMPT_VERSION: ${C2_IMUGS2_LLM_PROMPT_VERSION:-v3}
      C2_IMUGS2_LLM_TIMEOUT_SECONDS: ${C2_IMUGS2_LLM_TIMEOUT_SECONDS:-900}
      C2_IMUGS2_LLM_MAX_OUTPUT_TOKENS: ${C2_IMUGS2_LLM_MAX_OUTPUT_TOKENS:-65536}
      C2_IMUGS2_LLM_TEMPERATURE: ${C2_IMUGS2_LLM_TEMPERATURE:-1.0}
      C2_IMUGS2_LLM_TOP_P: ${C2_IMUGS2_LLM_TOP_P:-0.95}
      C2_IMUGS2_LLM_TOP_K: ${C2_IMUGS2_LLM_TOP_K:-20}
      C2_IMUGS2_LLM_MIN_P: ${C2_IMUGS2_LLM_MIN_P:-0.0}
      C2_IMUGS2_LLM_PRESENCE_PENALTY: ${C2_IMUGS2_LLM_PRESENCE_PENALTY:-0.0}
      C2_IMUGS2_LLM_REPEAT_PENALTY: ${C2_IMUGS2_LLM_REPEAT_PENALTY:-1.0}
      C2_IMUGS2_LLM_REASONING_EFFORT: ${C2_IMUGS2_LLM_REASONING_EFFORT:-xhigh}
      C2_IMUGS2_LLM_ENABLE_THINKING: ${C2_IMUGS2_LLM_ENABLE_THINKING:-true}
      C2_IMUGS2_LLM_PRESERVE_THINKING: ${C2_IMUGS2_LLM_PRESERVE_THINKING:-true}
    volumes:
      - ./data/runtime:/app/data/runtime
      - ./backend/config/data/map:/app/backend/config/data/map:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["c2-imugs2-api"]

  c2-imugs2-ui:
    image: node:20-bookworm-slim
    working_dir: /app/frontend
    volumes:
      - .:/app
      - c2-imugs2-ui-node-modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  c2-imugs2-ui-node-modules:
